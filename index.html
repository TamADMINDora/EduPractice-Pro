<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>EduPractice Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8FAFC;--sf:#fff;--tx:#0F172A;--mu:#64748B;--ln:#E2E8F0;--g:#10B981;--b:#0284C7;--a:#F59E0B;--r:#DC2626;--grid:rgba(2,132,199,.07);color-scheme:light}
:root[data-t=dark]{--bg:#0F172A;--sf:#162036;--tx:#E2E8F0;--mu:#94A3B8;--ln:#27344d;--grid:rgba(56,189,248,.08);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--tx);background:var(--bg) linear-gradient(var(--grid) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/32px 32px;min-height:100vh}
h1{font-size:24px;margin:0 0 18px;font-weight:800}h3{margin:0 0 8px}
.mono,code,.id{font-family:'JetBrains Mono',monospace;font-size:13px}
.mu{color:var(--mu)}.sm{font-size:13px;padding:5px 10px}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
aside{background:var(--sf);border-right:1px solid var(--ln);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;font-size:19px}.brand span{color:var(--g)}
nav{display:flex;flex-direction:column;gap:2px;flex:1}
nav a{padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--mu);font-weight:500}
nav a:hover{background:var(--bg)}nav a.on{background:rgba(16,185,129,.12);color:var(--g);font-weight:700;box-shadow:inset 3px 0 var(--g)}
.foot{display:flex;flex-direction:column;gap:8px}
main{padding:28px;max-width:1100px;width:100%}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:18px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px}
.st{margin:0}.st .n{font:600 30px 'JetBrains Mono',monospace;color:var(--b)}
.empty{border-style:dashed;text-align:center;padding:32px}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:9px 16px;background:var(--g);color:#04251a;cursor:pointer}
.btn.o{background:transparent;border:1px solid var(--ln);color:var(--tx)}.btn.b{background:var(--b);color:#fff}.btn.r{background:transparent;color:var(--r);border:1px solid var(--ln)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.opt:focus-visible{outline:2px solid var(--b);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx)}
textarea{min-height:84px;resize:vertical}
label{display:block;font-weight:500;font-size:13px;color:var(--mu);margin-bottom:4px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--ln);vertical-align:middle}th{color:var(--mu);font-weight:500;font-size:13px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--bg);border:1px solid var(--ln)}
.tag.g{color:var(--g);border-color:var(--g)}.tag.a{color:var(--a);border-color:var(--a)}.tag.b{color:var(--b);border-color:var(--b)}.tag.r{color:var(--r);border-color:var(--r)}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:var(--g)}
.login{max-width:400px;margin:9vh auto;padding:0 16px}
.exam{display:grid;grid-template-columns:1fr 260px;gap:16px;align-items:start}
.side{position:sticky;top:16px}
.timer{font:600 28px 'JetBrains Mono',monospace;color:var(--a);margin-bottom:12px}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pal button{width:38px;height:38px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:600 13px 'JetBrains Mono',monospace;cursor:pointer}
.pal button.ans{background:var(--g);color:#04251a;border-color:var(--g)}.pal button.cur{outline:2px solid var(--b)}
.qt{font-size:17px;font-weight:500;margin:6px 0 16px;white-space:pre-wrap}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;padding:11px 14px;margin-bottom:8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);cursor:pointer}
.opt.on{border-color:var(--b);background:rgba(2,132,199,.12);font-weight:700}
.tf{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;padding:8px 0;border-bottom:1px solid var(--ln)}
.tf .opt{display:inline-flex;width:auto;margin:0 0 0 6px}
.ok{border-left:4px solid var(--g)}.bad{border-left:4px solid var(--r)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:9;font-weight:500}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--g);margin-right:6px}
.dot.a{background:var(--a)}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.cc{background:var(--sf);border:1px solid var(--ln);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.cc .im{aspect-ratio:16/9;background:var(--ln)}.cc .im img,.cc .im svg,.th img,.th svg{width:100%;height:100%;object-fit:cover;display:block}
.cc .bd{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}.cc h3{margin:0;font-size:17px}
.cc .jf{display:flex;gap:8px;margin-top:auto}.cc .jf input{min-width:0}
.th{width:96px;flex:none;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--ln)}
.opt.ok2{border-color:var(--g);background:rgba(16,185,129,.16);font-weight:700}.opt.bad2{border-color:var(--r);background:rgba(220,38,38,.12)}.opt:disabled{cursor:default}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{position:static;height:auto}nav{flex-direction:row;flex-wrap:wrap}.exam{grid-template-columns:1fr}.side{position:static}main{padding:16px}}
.sync{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--g);flex:none}.sync.off{background:var(--a)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.55)}70%{box-shadow:0 0 0 8px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.sync:not(.off){animation:pulse 1.8s infinite}}
</style>
</head>
<body>
<script>
/* ===== EduPractice Pro: một file, chạy ngay. Mặc định lưu cục bộ; dán cấu hình Firebase trong Cài đặt để chuyển sang Cloud Firestore. ===== */
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const sha=async s=>{if(crypto.subtle)return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return'x'+h};
const mmss=ms=>{ms=Math.max(0,ms/1000|0);return String(ms/60|0).padStart(2,'0')+':'+String(ms%60).padStart(2,'0')};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2800)}

/* ---- Lớp dữ liệu: cùng một giao diện cho localStorage và Firestore ---- */
const LS={
  async list(c){return Object.values(JSON.parse(localStorage.getItem('edp_'+c)||'{}'))},
  async get(c,id){return JSON.parse(localStorage.getItem('edp_'+c)||'{}')[id]||null},
  watchOne(c,id,cb){const f=()=>LS.get(c,id).then(cb);f();const t=setInterval(f,2000);return()=>clearInterval(t)},
  async put(c,id,o){const m=JSON.parse(localStorage.getItem('edp_'+c)||'{}');m[id]={...o,id};localStorage.setItem('edp_'+c,JSON.stringify(m))},
  async del(c,id){const m=JSON.parse(localStorage.getItem('edp_'+c)||'{}');delete m[id];localStorage.setItem('edp_'+c,JSON.stringify(m))},
  watch(c,cb){const f=()=>LS.list(c).then(cb);f();const t=setInterval(f,2000);return()=>clearInterval(t)}
};
async function fsInit(cfg){
  const V='10.12.2',a=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),f=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const db=f.getFirestore(a.initializeApp(cfg)),L=s=>s.docs.map(d=>({...d.data(),id:d.id}));
  return{get:async(c,id)=>{const d=await f.getDoc(f.doc(db,c,id));return d.exists()?d.data():null},watchOne:(c,id,cb)=>f.onSnapshot(f.doc(db,c,id),d=>cb(d.exists()?d.data():null)),list:async c=>L(await f.getDocs(f.collection(db,c))),put:(c,id,o)=>f.setDoc(f.doc(db,c,id),{...o,id}),del:(c,id)=>f.deleteDoc(f.doc(db,c,id)),watch:(c,cb)=>f.onSnapshot(f.collection(db,c),s=>cb(L(s)))};
}
let DB=LS,MODE='Lưu cục bộ trong trình duyệt',PID='';
/* Dán cấu hình Firebase (dạng JSON) thay cho null để MỌI người mở web đều tự liên kết cloud. Lấy sẵn dòng này trong Cài đặt. */
const EMBEDDED_CFG={"apiKey":"AIzaSyDprku7v6AVcUq9cM871HbrZOGNnJZqmeY","authDomain":"edulearn-677c5.firebaseapp.com","projectId":"edulearn-677c5","storageBucket":"edulearn-677c5.firebasestorage.app","messagingSenderId":"559238512834","appId":"1:559238512834:web:06141c945fb82345197b5b","measurementId":"G-5312JR7T95"};
const badge=()=>PID?`<span class="sync" role="img" title="Đã đồng bộ cloud: ${esc(PID)}" aria-label="Đã đồng bộ cloud"></span>`:`<span class="sync off" role="img" title="Chưa đồng bộ cloud (chế độ cục bộ)" aria-label="Chưa đồng bộ cloud"></span>`;
const S={user:null,v:'',off:null};let X=null;
const ACT={},FORM={},VIEWS={};let LN={},QC={},LC={},PR=null;
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&ACT[b.dataset.act])ACT[b.dataset.act](b.dataset,b)});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();FORM[f.dataset.f](f,Object.fromEntries(new FormData(f)))});
document.addEventListener('input',e=>{if(e.target.id==='sa')ACT.sa(e.target.value);if(e.target.id==='pa'&&PR)PR.ans[PR.qs[PR.i].id]=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pa')ACT.prc()});

/* ---- Giao diện sáng/tối ---- */
const theme=t=>{document.documentElement.dataset.t=t;localStorage.setItem('edp_theme',t)};
ACT.theme=()=>theme(document.documentElement.dataset.t==='dark'?'light':'dark');

/* ===== Mô-đun 1: Đăng nhập & phân quyền ===== */
async function boot(){
  theme(localStorage.getItem('edp_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
  const cfg=localStorage.getItem('edp_fbcfg')||(EMBEDDED_CFG&&JSON.stringify(EMBEDDED_CFG));
  if(cfg){try{const c=JSON.parse(cfg),d=await fsInit(c);await Promise.race([d.list('users'),new Promise((_,r)=>setTimeout(()=>r(new Error('quá thời gian chờ')),8000))]);DB=d;PID=c.projectId;MODE='Firebase Cloud Firestore'}catch(e){toast('Không liên kết được cloud ('+(e.code||e.message)+'), đang dùng chế độ cục bộ')}}
  const me=sessionStorage.getItem('edp_sess');
  if(me){const u=(await DB.list('users')).find(x=>x.id===me);if(u){S.user=u;
    if(u.role!=='admin'){S.sid=sessionStorage.getItem('edp_sid');let bad=!S.sid;try{const d=await DB.get('sessions',u.id);if(d&&d.sid!==S.sid)bad=true}catch(e){}
      if(bad){S.user=null;sessionStorage.removeItem('edp_sess');return loginView('Tài khoản này đang được dùng ở thiết bị khác hoặc phiên đã hết hạn. Hãy đăng nhập lại.')}}
    shell();guard();return}}
  loginView();
}
async function showCase(){await loadLN();const cs=await DB.list('courses');if(!cs.length||!$('#sc'))return;$('#sc').innerHTML=`<div style="max-width:1100px;margin:30px auto 0;padding:0 16px 40px"><h2 style="margin:0 0 14px">Các khóa học đang mở</h2><div class="cg">${cs.map(c=>courseCard(c,'guest')).join('')}</div></div>`}
async function loginView(msg){
  const first=!(await DB.list('users')).length;
  document.body.innerHTML=`<div class="login"><div class="brand" style="font-size:28px;margin-bottom:6px;display:flex;align-items:center;gap:12px">EduPractice <span>Pro</span>${badge()}</div>${msg?`<div class="card bad" style="padding:12px">${esc(msg)}</div>`:''}<p class="mu">${first?'Tạo tài khoản quản trị đầu tiên để bắt đầu.':'Đăng nhập để vào khóa học của bạn.'}</p>
  <form class="card" data-f="${first?'setup':'login'}">${first?'<div style="margin-bottom:12px"><label>Họ tên</label><input name="name" required></div>':''}
  <div style="margin-bottom:12px"><label>Tên đăng nhập</label><input name="user" required pattern="[A-Za-z0-9._\\-]+" autocomplete="username"></div>
  <div style="margin-bottom:16px"><label>Mật khẩu</label><input name="pw" type="password" required minlength="6" autocomplete="current-password"></div>
  <button class="btn" style="width:100%">${first?'Tạo quản trị viên':'Đăng nhập'}</button></form>${first?'':'<p class="mu sm">Hệ thống ghi nhận địa chỉ IP khi học viên đăng nhập và làm bài để phòng việc làm bài hộ. Mỗi tài khoản học viên chỉ dùng được trên một thiết bị tại một thời điểm.</p>'}</div><div id="sc"></div>`;if(!first)showCase();
}
async function getIP(){if(S.ip)return S.ip;try{const c=new AbortController();setTimeout(()=>c.abort(),4000);const r=await fetch('https://api.ipify.org?format=json',{signal:c.signal});S.ip=(await r.json()).ip||'không xác định'}catch(e){S.ip='không xác định'}return S.ip}
async function logLogin(u,kick){try{await DB.put('logins',uid(),{user:u.id,name:u.name,ip:await getIP(),ua:navigator.userAgent.slice(0,160),at:Date.now(),kick:!!kick})}catch(e){}}
async function enter(u){
  S.user=u;sessionStorage.setItem('edp_sess',u.id);
  if(u.role!=='admin'){S.sid=uid();sessionStorage.setItem('edp_sid',S.sid);let kick=false;
    try{const prev=await DB.get('sessions',u.id),ip=await getIP();kick=!!(prev&&prev.ip!==ip&&Date.now()-prev.at<72e5);
      await DB.put('sessions',u.id,{user:u.id,sid:S.sid,ip,ua:navigator.userAgent.slice(0,160),at:Date.now()})}
    catch(e){toast('Chưa bật được giới hạn 1 thiết bị, hãy báo quản trị viên kiểm tra Firestore Rules')}
    logLogin(u,kick)}
  shell();guard();
}
function guard(){if(S.user.role==='admin')return;S.gOff&&S.gOff();try{S.gOff=DB.watchOne('sessions',S.user.id,d=>{if(d&&S.sid&&d.sid!==S.sid)ACT.out('Tài khoản này vừa được đăng nhập ở thiết bị khác, nên phiên này đã bị đăng xuất. Bài làm dở (nếu có) vẫn được lưu để làm tiếp.')})}catch(e){}}
FORM.setup=async(f,d)=>{const id=d.user.trim().toLowerCase();const u={id,name:d.name.trim(),role:'admin',hash:await sha(id+':'+d.pw)};await DB.put('users',id,u);enter(u)};
FORM.login=async(f,d)=>{const id=d.user.trim().toLowerCase(),u=(await DB.list('users')).find(x=>x.id===id);if(!u||u.hash!==await sha(id+':'+d.pw))return toast('Sai tên đăng nhập hoặc mật khẩu');enter(u)};
ACT.out=m=>{X&&X.stop&&X.stop();X=null;PR=null;S.off&&S.off();S.gOff&&S.gOff();S.gOff=null;sessionStorage.removeItem('edp_sess');sessionStorage.removeItem('edp_sid');S.user=null;loginView(typeof m==='string'?m:'')};

function shell(){
  const adm=S.user.role==='admin';
  const items=adm?[['home','Tổng quan'],['courses','Khóa học'],['cat','Trang quảng bá'],['codes','Mã kích hoạt'],['bank','Ngân hàng đề'],['live','Giám sát & thống kê'],['ips','Nhật ký đăng nhập'],['users','Người dùng'],['set','Cài đặt']]:[['cat','Khám phá khóa học'],['my','Khóa học của tôi'],['hist','Kết quả đã làm']];
  document.body.innerHTML=`<div class="app"><aside><div class="brand" style="display:flex;align-items:center;gap:10px">EduPractice <span>Pro</span>${badge()}</div><nav>${items.map(([k,t])=>`<a tabindex="0" data-act="go" data-v="${k}" id="n_${k}">${t}</a>`).join('')}</nav>
  <div class="foot"><div class="mu sm">${esc(S.user.name)} (${adm?'Quản trị':'Học viên'})</div><div class="mu sm mono">Phiên bản 6</div><button class="btn o sm" data-act="theme">Đổi giao diện</button><button class="btn o sm" data-act="out">Đăng xuất</button></div></aside><main id="main"></main></div>`;
  go(adm?'home':'cat');
}
const showErr=e=>{const c=String(e&&(e.code||e.message)||'lỗi không rõ');if($('#main'))$('#main').innerHTML=`<div class="card bad"><h3>Không tải được trang này</h3><p>Chi tiết: <code>${esc(c)}</code></p>${/permission|insufficient/i.test(c)?'<p>Firestore Rules đang chặn việc đọc hoặc ghi dữ liệu. Hãy cập nhật Rules để có thêm collection <code>lessons</code>, rồi bấm Publish và tải lại trang.</p>':''}</div>`};
addEventListener('unhandledrejection',e=>toast('Lỗi: '+String(e.reason&&(e.reason.code||e.reason.message)||e.reason)));
function go(v){
  S.off&&S.off();S.off=null;if(X){X.stop();X=null}
  S.v=v;const hv={course:'cat',lessons:'courses'}[v]||v;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===hv));Promise.resolve(VIEWS[v]()).catch(showErr);
}
ACT.go=d=>go(d.v);
ACT.del=async d=>{if(!confirm('Xóa mục này?'))return;if(S.v==='bank'){S.cid=$('#bc').value;S.lid=$('#bl').value}
  await DB.del(d.c,d.i);
  if(d.c==='courses'){for(const q of(await DB.list('questions')).filter(q=>q.courseId===d.i))await DB.del('questions',q.id);for(const l of(await DB.list('lessons')).filter(l=>l.courseId===d.i))await DB.del('lessons',l.id)}
  if(d.c==='lessons')for(const q of(await DB.list('questions')).filter(q=>q.lessonId===d.i))await DB.put('questions',q.id,{...q,lessonId:''});
  go(S.v)};
const cOpts=cs=>cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
const noCourse=`<div class="card empty"><h3>Chưa có khóa học nào</h3><p class="mu">Tạo khóa học trước, sau đó quay lại đây.</p><button class="btn" data-act="go" data-v="courses">Tạo khóa học</button></div>`;

/* ===== Tổng quan ===== */
VIEWS.home=async()=>{
  const[c,q,k,u]=await Promise.all(['courses','questions','codes','users'].map(x=>DB.list(x)));
  $('#main').innerHTML=`<h1>Tổng quan</h1><div class="stats">${[['Khóa học',c.length],['Câu hỏi',q.length],['Mã kích hoạt',k.length],['Tài khoản',u.length]].map(([a,b])=>`<div class="card st"><div class="n">${b}</div>${a}</div>`).join('')}</div>
  ${c.length?'':`<div class="card empty"><h3>Nền tảng đang trống</h3><p class="mu">Làm theo thứ tự: tạo khóa học, thêm câu hỏi vào ngân hàng đề, tạo mã kích hoạt, rồi tạo tài khoản học viên.</p><button class="btn" data-act="go" data-v="courses">Tạo khóa học đầu tiên</button></div>`}

async function redeem(raw,cid){
  const id=raw.trim().toUpperCase(),k=(await DB.list('codes')).find(x=>x.id===id);
  if(!k)return toast('Mã không tồn tại');
  if(cid&&k.courseId!==cid)return toast('Mã này không thuộc khóa học này');
  if(k.usedBy)return toast('Mã này đã được sử dụng');
  if(k.exp&&new Date(k.exp+'T23:59:59')<Date.now())return toast('Mã đã hết hạn');
  if(k.bound&&k.bound!==S.user.id)return toast('Mã này được cấp cho tài khoản khác');
  const eid=S.user.id+'_'+k.courseId;
  if((await DB.list('enroll')).some(e=>e.id===eid))return toast('Bạn đã có khóa học này');
  await DB.put('enroll',eid,{user:S.user.id,courseId:k.courseId,at:Date.now()});
  await DB.put('codes',id,{...k,usedBy:S.user.id,usedAt:Date.now()});toast('Kích hoạt thành công');return true;
}

const PN=['','Phần I, nhiều lựa chọn','Phần II, đúng/sai','Phần III, trả lời ngắn'];
function parseAns(p,v){
  v=String(v||'').trim();
  if(p==1){const i='ABCD'.indexOf(v.toUpperCase());return v.length==1&&i>=0?i:null}
  if(p==2){const s=v.replace(/\s/g,'');if(s.length!=4)return null;const r=[...s].map(c=>'ĐđDdTt1'.includes(c)?true:'SsFf0'.includes(c)?false:null);return r.includes(null)?null:r}
  return v||null;
}

/* ---- Làm bài: giao diện một trang, đổi câu không tải lại, không cuộn nhảy ---- */
const norm=s=>String(s||'').trim().toLowerCase().replace(',','.').replace(/\s/g,'');
const grade=(q,a)=>q.part==1?(a===q.ans?1:0):q.part==2?[0,.1,.25,.5,1][q.ans.filter((v,i)=>a&&a[i]===v).length]:(norm(a)&&norm(a)===norm(q.ans)?1:0);
const isAns=(q,a)=>q.part==1?a!=null:q.part==2?!!a&&a.some(v=>v!=null):!!norm(a);
const fa=(q,a)=>a==null?'chưa trả lời':q.part==1?'ABCD'[a]:q.part==2?a.map((v,i)=>'abcd'[i]+':'+(v==null?'-':v?'Đ':'S')).join(' '):a;
const fc=q=>q.part==1?'ABCD'[q.ans]:q.part==2?q.ans.map((v,i)=>'abcd'[i]+':'+(v?'Đ':'S')).join(' '):q.ans;
ACT.start=async d=>{
  const c=(await DB.list('courses')).find(x=>x.id===d.c),all=await DB.list('questions'),qs=[];let l=null;
  if(d.l){l=(await DB.list('lessons')).find(x=>x.id===d.l);[1,2,3].forEach(p=>{const g=all.filter(q=>q.lessonId===l.id&&q.part===p).sort((a,b)=>a.at-b.at);qs.push(...(l.shuf?shuffle(g):g))})}
  else[1,2,3].forEach(p=>qs.push(...shuffle(all.filter(q=>q.courseId===c.id&&q.part===p)).slice(0,c['n'+p])));
  if(!qs.length)return toast(l?'Bài học chưa có câu hỏi':'Khóa học chưa có câu hỏi');
  const A={id:uid(),user:S.user.id,name:S.user.name,courseId:c.id,lessonId:l?l.id:'',courseName:c.name+(l?' / '+l.title:''),start:Date.now(),mins:l?(l.mins||0):c.mins,qs,ans:{},cur:0,answered:0,status:'doing',score:null,ip:await getIP(),updated:Date.now()};
  await DB.put('attempts',A.id,A);exam(A);
};
ACT.resume=async d=>exam((await DB.list('attempts')).find(a=>a.id===d.a));
function exam(A){
  S.off&&S.off();S.cid=A.courseId;const qs=A.qs;
  $('#main').innerHTML=`<div class="exam"><div class="card" id="qp"></div><div class="card side"><div class="timer" id="tm"></div><div class="pal" id="pal"></div><div style="display:flex;gap:8px"><button class="btn o" data-act="xexit">Lưu và thoát</button><button class="btn" data-act="xsubmit">Nộp bài</button></div></div></div>`;
  const save=()=>{A.updated=Date.now();A.answered=qs.filter(q=>isAns(q,A.ans[q.id])).length;return DB.put('attempts',A.id,A)};
  const pal=()=>$('#pal')&&($('#pal').innerHTML=qs.map((q,i)=>`<button class="${isAns(q,A.ans[q.id])?'ans':''} ${i==A.cur?'cur':''}" data-act="xgo" data-i="${i}">${i+1}</button>`).join(''));
  const draw=()=>{const q=qs[A.cur],a=A.ans[q.id];let b='';
    if(q.part==1)b=q.opts.map((o,i)=>`<button class="opt ${a===i?'on':''}" data-act="xo" data-i="${i}"><b>${'ABCD'[i]}</b>${esc(o)}</button>`).join('');
    else if(q.part==2)b=q.opts.map((o,i)=>`<div class="tf"><span><b>${'abcd'[i]})</b> ${esc(o)}</span><span><button class="opt ${a&&a[i]===true?'on':''}" data-act="xt" data-i="${i}" data-v="1">Đúng</button><button class="opt ${a&&a[i]===false?'on':''}" data-act="xt" data-i="${i}" data-v="0">Sai</button></span></div>`).join('');
    else b=`<input id="sa" value="${esc(a||'')}" placeholder="Nhập đáp số" autocomplete="off">`;
    $('#qp').innerHTML=`<div class="mu">${PN[q.part]}, câu ${A.cur+1}/${qs.length}</div><div class="qt">${esc(q.text)}</div>${b}<div style="display:flex;justify-content:space-between;margin-top:16px"><button class="btn o" data-act="xgo" data-i="${A.cur-1}" ${A.cur?'':'disabled'}>Câu trước</button><button class="btn o" data-act="xgo" data-i="${A.cur+1}" ${A.cur<qs.length-1?'':'disabled'}>Câu sau</button></div>`;pal()};
  const tick=()=>{if(!A.mins){const t=$('#tm');if(t){t.textContent='Không giới hạn';t.style.fontSize='18px'}return}const left=A.start+A.mins*60000-Date.now();if($('#tm'))$('#tm').textContent=mmss(left);if(left<=0){toast('Hết giờ, hệ thống tự nộp bài');submit()}};
  const iv=[setInterval(tick,1000),setInterval(save,10000)];
  const submit=async()=>{X.stop();const sum=qs.reduce((s,q)=>s+grade(q,A.ans[q.id]),0);A.status='done';A.score=Math.round(sum/qs.length*1000)/100;A.end=Date.now();await save();X=null;result(A)};
  X={stop:()=>iv.forEach(clearInterval),
    set:(v)=>{A.ans[qs[A.cur].id]=v;save();draw()},
    go:i=>{if(i>=0&&i<qs.length){A.cur=i;draw()}},submit,
    exit:async()=>{await save();go(A.lessonId?'course':'cat')},
    sa:v=>{A.ans[qs[A.cur].id]=v;save();pal()},
    tf:(i,v)=>{const q=qs[A.cur],r=(A.ans[q.id]||[null,null,null,null]).slice();r[i]=v;X.set(r)}};
  draw();tick();
}
ACT.xo=d=>X.set(+d.i);ACT.xt=d=>X.tf(+d.i,d.v==='1');ACT.xgo=d=>X.go(+d.i);ACT.sa=v=>X&&X.sa(v);ACT.xexit=()=>X.exit();
ACT.xsubmit=()=>confirm('Nộp bài ngay bây giờ?')&&X.submit();
function result(A){
  S.off&&S.off();
  $('#main').innerHTML=`<h1>Kết quả: ${esc(A.courseName)}</h1><div class="card"><div class="mono" style="font-size:38px;color:var(--g)">${A.score}/10</div><span class="mu">Đã trả lời ${A.answered}/${A.qs.length} câu</span> <button class="btn o sm" data-act="go" data-v="${S.user.role==='admin'?'live':'hist'}">Quay lại</button></div>
  ${A.qs.map((q,i)=>{const g=grade(q,A.ans[q.id]);return`<div class="card ${g==1?'ok':'bad'}"><div class="mu sm">Câu ${i+1}, ${PN[q.part]}</div><div class="qt" style="font-size:15px">${esc(q.text)}</div>${q.part<3?q.opts.map((o,k)=>`<div class="sm">${'ABCD'[k]}. ${esc(o)}</div>`).join(''):''}<p class="sm"><b>Bạn chọn:</b> ${esc(fa(q,A.ans[q.id]))}. <b>Đáp án:</b> ${esc(fc(q))}</p>${q.exp?`<p class="sm mu">${esc(q.exp)}</p>`:''}</div>`}).join('')}`;
}

/* ---- Chế độ luyện tập: chọn xong là hiện đáp án và giải thích ngay ---- */
ACT.prac=async d=>{
  const all=await DB.list('questions');let qs;
  if(d.l){const l=(await DB.list('lessons')).find(x=>x.id===d.l);qs=[1,2,3].flatMap(p=>{const g=all.filter(q=>q.lessonId===l.id&&q.part===p).sort((a,b)=>a.at-b.at);return l.shuf?shuffle(g):g})}
  else qs=shuffle(all.filter(q=>q.courseId===d.c));
  if(!qs.length)return toast('Chưa có câu hỏi để luyện tập');
  S.cid=d.c;PR={qs,i:0,ans:{},done:{},fin:false};practice();
};
function practice(){
  const n=PR.qs.length;
  if(PR.fin){const dn=PR.qs.filter(x=>PR.done[x.id]),ok=dn.filter(x=>grade(x,PR.ans[x.id])==1).length;
    $('#main').innerHTML=`<h1>Hoàn thành luyện tập</h1><div class="card"><div class="mono" style="font-size:36px;color:var(--g)">${ok}/${n}</div><p class="mu">Bạn đã kiểm tra ${dn.length}/${n} câu và đúng hoàn toàn ${ok} câu.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="prr">Luyện lại (xáo trộn)</button><button class="btn o" data-act="prx">Quay lại khóa học</button></div></div>`;return}
  const q=PR.qs[PR.i],a=PR.ans[q.id],ck=!!PR.done[q.id],right=PR.qs.filter(x=>PR.done[x.id]&&grade(x,PR.ans[x.id])==1).length,dis=ck?'disabled':'';
  let b='';
  if(q.part==1)b=q.opts.map((o,i)=>`<button class="opt ${ck?(i===q.ans?'ok2':a===i?'bad2':''):(a===i?'on':'')}" data-act="pro" data-i="${i}" ${dis}><b>${'ABCD'[i]}</b>${esc(o)}</button>`).join('');
  else if(q.part==2){const cl=(i,val)=>{const v=a&&a[i];return ck?(q.ans[i]===val?'ok2':v===val?'bad2':''):(v===val?'on':'')};
    b=q.opts.map((o,i)=>`<div class="tf"><span><b>${'abcd'[i]})</b> ${esc(o)}</span><span><button class="opt ${cl(i,true)}" data-act="prt" data-i="${i}" data-v="1" ${dis}>Đúng</button><button class="opt ${cl(i,false)}" data-act="prt" data-i="${i}" data-v="0" ${dis}>Sai</button></span></div>`).join('')+(ck?'':'<button class="btn" data-act="prc" style="margin-top:8px">Kiểm tra</button>')}
  else b=`<input id="pa" value="${esc(a||'')}" placeholder="Nhập đáp số" autocomplete="off" ${dis}>`+(ck?'':'<button class="btn" data-act="prc" style="margin-top:10px">Kiểm tra</button>');
  const g=ck?grade(q,a):0;
  $('#main').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px"><h1 style="margin:0">Luyện tập</h1><button class="btn o sm" data-act="prx">Thoát</button></div>
  <div class="bar" style="margin-bottom:6px"><i style="width:${(PR.i+1)/n*100}%"></i></div><div class="mu sm" style="margin-bottom:12px">Câu ${PR.i+1}/${n}, đã đúng ${right}</div>
  <div class="card"><div class="mu sm">${PN[q.part]}</div><div class="qt">${esc(q.text)}</div>${b}
  ${ck?`<div class="card ${g==1?'ok':'bad'}" style="margin:14px 0 0"><b>${g==1?'Chính xác':'Chưa đúng'}</b><p class="sm" style="margin:6px 0">Đáp án đúng: <b>${esc(fc(q))}</b></p>${q.exp?`<p class="sm mu" style="margin:0">${esc(q.exp)}</p>`:''}</div>`:''}
  <div style="display:flex;justify-content:space-between;margin-top:16px"><button class="btn o" data-act="prp" ${PR.i?'':'disabled'}>Câu trước</button><button class="btn ${ck?'':'o'}" data-act="prn">${PR.i<n-1?'Câu sau':'Hoàn thành'}</button></div></div>`;
}
ACT.pro=d=>{const q=PR.qs[PR.i];if(PR.done[q.id])return;PR.ans[q.id]=+d.i;PR.done[q.id]=true;practice()};
ACT.prt=d=>{const q=PR.qs[PR.i];if(PR.done[q.id])return;const r=(PR.ans[q.id]||[null,null,null,null]).slice();r[+d.i]=d.v==='1';PR.ans[q.id]=r;if(r.every(v=>v!=null))PR.done[q.id]=true;practice()};
ACT.prc=()=>{const q=PR.qs[PR.i];if(PR.done[q.id])return;if(!isAns(q,PR.ans[q.id]))return toast('Hãy chọn hoặc nhập đáp án trước khi kiểm tra');PR.done[q.id]=true;practice()};
ACT.prn=()=>{if(PR.i<PR.qs.length-1)PR.i++;else PR.fin=true;practice()};
ACT.prp=()=>{if(PR.i>0)PR.i--;practice()};
ACT.prr=()=>{PR={qs:shuffle(PR.qs),i:0,ans:{},done:{},fin:false};practice()};
ACT.prx=()=>{PR=null;go('course')};

/* ---- Nhật ký đăng nhập và IP (quản trị) ---- */
VIEWS.ips=async()=>{
  const[lg,us]=await Promise.all([DB.list('logins'),DB.list('users')]),by={};

    const ips24=new Set(a.filter(l=>Date.now()-l.at<864e5).map(l=>l.ip)),all=new Set(a.map(l=>l.ip)),per={};

  ${mine.length?mine.map(c=>{const d=doing.find(a=>a.courseId===c.id);return`<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><b>${esc(c.name)}</b><div class="mu sm">${esc(c.desc)} Đề ${c.n1}/${c.n2}/${c.n3} câu, ${c.mins} phút.</div></div><button class="btn" data-act="enter" data-c="${c.id}">Vào học</button></div>`}).join(''):'<div class="card empty"><h3>Bạn chưa có khóa học nào</h3><p class="mu">Nhập mã kích hoạt do quản trị viên cấp để mở khóa học.</p></div>'}`;
};
VIEWS.hist=async()=>{
  const at=(await DB.list('attempts')).filter(a=>a.user===S.user.id&&a.status==='done').sort((a,b)=>b.end-a.end);
  $('#main').innerHTML=`<h1>Kết quả đã làm</h1><div class="card">${at.length?`<table><tr><th>Khóa học</th><th>Ngày làm</th><th>Điểm</th><th></th></tr>${at.map(a=>`<tr><td>${esc(a.courseName)}</td><td class="mono">${new Date(a.end).toLocaleString('vi-VN')}</td><td class="mono">${a.score}/10</td><td><button class="btn o sm" data-act="view" data-a="${a.id}">Xem lại</button></td></tr>`).join('')}</table>`:'<p class="mu">Chưa có bài làm nào.</p>'}</div>`;
};

/* ===== Mô-đun 4: Giám sát trực tiếp & thống kê ===== */
VIEWS.live=()=>{
  $('#main').innerHTML='<h1>Giám sát và thống kê</h1><div id="lv"></div>';let data=[];
  const draw=()=>{const el=$('#lv');if(!el)return;const now=Date.now(),done=data.filter(a=>a.status==='done'),doing=data.filter(a=>a.status==='doing'),live=doing.filter(a=>now-a.updated<45000);
    const avg=done.length?(done.reduce((s,a)=>s+a.score,0)/done.length).toFixed(2):'-';
    const byC={};done.forEach(a=>(byC[a.courseName]=byC[a.courseName]||[]).push(a.score));
    el.innerHTML=`<div class="stats">${[['Đang làm bài',live.length],['Tổng lượt làm',data.length],['Đã nộp',done.length],['Điểm trung bình',avg]].map(([a,b])=>`<div class="card st"><div class="n">${b}</div>${a}</div>`).join('')}</div>
    <div class="card"><h3>Theo dõi trực tiếp</h3>${data.length?`<table><tr><th>Học viên</th><th>Khóa học</th><th>Trạng thái</th><th>Tiến độ</th><th>Còn lại</th><th>Điểm</th><th>IP</th></tr>${[...data].sort((a,b)=>b.updated-a.updated).map(a=>{const lv=now-a.updated<45000;return`<tr><td>${esc(a.name)}</td><td>${esc(a.courseName)}</td><td>${a.status==='done'?'<span class="tag g">Đã nộp</span>':lv?'<span class="dot"></span>Đang làm':'<span class="dot a"></span>Mất kết nối'}</td><td><div class="bar"><i style="width:${a.answered/a.qs.length*100}%"></i></div><span class="mu sm mono">${a.answered}/${a.qs.length}</span></td><td class="mono">${a.status==='done'||!a.mins?'-':mmss(a.start+a.mins*60000-now)}</td><td class="mono">${a.score??'-'}</td><td class="mono sm">${esc(a.ip||'-')}</td></tr>`}).join('')}</table>`:'<p class="mu">Chưa có lượt làm bài nào. Dữ liệu sẽ xuất hiện ngay khi có học viên bắt đầu.</p>'}</div>
    ${Object.keys(byC).length?`<div class="card"><h3>Điểm trung bình theo khóa học</h3>${Object.entries(byC).map(([n,s])=>{const m=s.reduce((x,y)=>x+y,0)/s.length;return`<div style="margin-bottom:10px"><div class="sm">${esc(n)}: <b class="mono">${m.toFixed(2)}</b> (${s.length} bài)</div><div class="bar"><i style="width:${m*10}%;background:var(--b)"></i></div></div>`}).join('')}</div>`:''}`};
  const u=DB.watch('attempts',d=>{data=d;draw()}),t=setInterval(draw,5000);S.off=()=>{u();clearInterval(t)};
};

/* ===== Người dùng & Cài đặt ===== */
VIEWS.users=async()=>{
  const us=await DB.list('users');
  $('#main').innerHTML=`<h1>Người dùng</h1><form class="card" data-f="user"><div class="fg"><div><label>Họ tên</label><input name="name" required></div><div><label>Tên đăng nhập</label><input name="user" required pattern="[A-Za-z0-9._\\-]+"></div><div><label>Mật khẩu (từ 6 ký tự)</label><input name="pw" required minlength="6"></div><div><label>Vai trò</label><select name="role"><option value="student">Học viên</option><option value="admin">Quản trị viên</option></select></div></div><button class="btn">Tạo tài khoản</button></form>
  <div class="card"><table><tr><th>Họ tên</th><th>Tên đăng nhập</th><th>Vai trò</th><th></th></tr>${us.map(u=>`<tr><td>${esc(u.name)}</td><td class="id">${esc(u.id)}</td><td>${u.role==='admin'?'Quản trị':'Học viên'}</td><td>${u.id===S.user.id?'':`<button class="btn r sm" data-act="del" data-c="users" data-i="${u.id}">Xóa</button>`}</td></tr>`).join('')}</table></div>`;
};
FORM.user=async(f,d)=>{const id=d.user.trim().toLowerCase();if((await DB.list('users')).some(u=>u.id===id))return toast('Tên đăng nhập đã tồn tại');await DB.put('users',id,{id,name:d.name.trim(),role:d.role,hash:await sha(id+':'+d.pw)});toast('Đã tạo tài khoản');go('users')};
VIEWS.set=()=>{
  $('#main').innerHTML=`<h1>Cài đặt</h1><div class="card"><b>Nơi lưu dữ liệu hiện tại:</b> ${MODE}<div style="margin-top:10px">${badge()} <span class="sm">${PID?'Đã đồng bộ cloud: '+esc(PID):'Chưa đồng bộ, đang dùng chế độ cục bộ'}</span> <button class="btn o sm" data-act="ping">Kiểm tra kết nối</button></div></div>
  ${localStorage.getItem('edp_fbcfg')?`<div class="card"><h3>Cho học viên dùng chung cloud</h3><p class="mu sm">Cấu hình vừa dán chỉ nằm trong trình duyệt của bạn nên máy học viên chưa thấy. Mở <code>index.html</code>, thay dòng <code>const EMBEDDED_CFG=null;</code> bằng dòng dưới, rồi đưa lại lên GitHub.</p><textarea readonly class="mono" onclick="this.select()">const EMBEDDED_CFG=${esc(localStorage.getItem('edp_fbcfg'))};</textarea></div>`:''}<form class="card" data-f="fb"><h3>Kết nối Firebase Cloud Firestore</h3><p class="mu sm">Dán đối tượng firebaseConfig (JSON) lấy từ Firebase Console. Sau khi lưu, trang tải lại và dùng Firestore với các collection: users, courses, codes, questions, enroll, attempts. Dữ liệu đang lưu cục bộ không tự chuyển sang Firestore.</p>
  <textarea name="cfg" class="mono" style="min-height:140px" placeholder='{"apiKey":"...","authDomain":"...","projectId":"...","appId":"..."}'></textarea><div style="display:flex;gap:10px;margin-top:12px"><button class="btn">Lưu và kết nối</button><button type="button" class="btn o" data-act="fboff">Quay về chế độ cục bộ</button></div></form>
  <div class="card mu sm">Lưu ý bảo mật: đăng nhập chạy phía trình duyệt nên chỉ phù hợp để ôn tập nội bộ. Khi triển khai thật, hãy đặt Firestore Security Rules hoặc chuyển sang Firebase Authentication.</div>`;
};
const parseCfg=t=>{const m=t.match(/\{[\s\S]*\}/);if(!m)throw 0;return JSON.parse(m[0].replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/,\s*}/g,'}'))};
FORM.fb=(f,d)=>{let c;try{c=parseCfg(d.cfg);if(!c.apiKey||!c.projectId)throw 0}catch(e){return toast('Chưa đọc được cấu hình, hãy dán nguyên đoạn firebaseConfig')}localStorage.setItem('edp_fbcfg',JSON.stringify(c));location.reload()};
ACT.ping=async()=>{const t=Date.now();try{await DB.list('users');toast(PID?`Đã kết nối Firestore (${PID}), phản hồi ${Date.now()-t} ms`:'Đang ở chế độ cục bộ, chưa liên kết cloud')}catch(e){toast('Lỗi kết nối: '+(e.code||e.message))}};
ACT.fboff=()=>{localStorage.removeItem('edp_fbcfg');location.reload()};

boot();
</script>
</body>
</html>
